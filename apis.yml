name: OpenFX
description: 'OpenFX is a cross-border payment infrastructure provider delivering real-time foreign
  exchange liquidity and settlement for institutional clients across emerging markets. Backed by Accel
  and Northzone, it pairs traditional-finance reliability with blockchain-rail speed to settle fiat and
  stablecoin payments in minutes across 40+ currency pairs and 25+ local payment rails, and exposes a
  programmatic Trading API (REST, FIX and Streaming) to automate quotes, trades, deposits and
  withdrawals. Serves remittance companies, FX on/off ramps, payment service providers and stablecoin
  infrastructure providers.'
